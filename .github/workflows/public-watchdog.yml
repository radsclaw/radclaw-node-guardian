name: public-watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-watchdog
  cancel-in-progress: true

jobs:
  verify-public-service:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check public health and fresh node status
        shell: python
        run: |
          import datetime as dt
          import json
          import urllib.request

          health_url = "https://radclaw.tail210fab.ts.net:10000/health"
          status_url = "https://radclaw.tail210fab.ts.net:10000/api/v1/status"

          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "radclaw-node-guardian-external-watchdog/1"},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{url} returned HTTP {response.status}")
                  return json.load(response)

          health = fetch(health_url)
          if health != {"status": "ok"}:
              raise RuntimeError(f"unhealthy response: {health!r}")

          status = fetch(status_url)
          required = {
              "schema_version", "service", "generated_at", "status", "network",
              "version", "block_height", "normal_channels", "receive_ready",
          }
          if set(status) != required:
              raise RuntimeError("public status schema mismatch")
          if status["status"] != "ok":
              raise RuntimeError(f"node status is {status['status']!r}")

          generated = dt.datetime.fromisoformat(status["generated_at"].replace("Z", "+00:00"))
          age = (dt.datetime.now(dt.timezone.utc) - generated).total_seconds()
          if age < -60 or age > 600:
              raise RuntimeError(f"status age is outside allowed range: {age:.0f}s")
